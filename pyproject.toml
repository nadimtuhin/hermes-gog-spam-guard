[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-gog-spam-guard"
version = "0.1.0"
description = "Prompt injection firewall and Gmail server-side filter engine for Hermes Agent."
readme = "README.md"
authors = [{ name = "Omar Faruque Tuhin (Nadim)", email = "nadimtuhin@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Communications :: Email",
]
keywords = ["hermes-agent", "prompt-injection", "ai-security", "gmail", "spam-filter", "llm-guard"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/nadimtuhin/hermes-gog-spam-guard"
Repository = "https://github.com/nadimtuhin/hermes-gog-spam-guard"

[project.scripts]
hermes-gog-spam-guard = "hermes_gog_spam_guard.cli:main"
gog-spam-guard = "hermes_gog_spam_guard.cli:main"
