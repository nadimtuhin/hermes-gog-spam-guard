name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools pytest
          python -m pip install -e .
      - name: Run test suite
        run: python -m pytest -v
      - name: Smoke-test the CLI entry point
        run: |
          hermes-gog-spam-guard validate-query 'subject:("Free Spins" OR "royal welcome")'
          ! hermes-gog-spam-guard validate-query 'subject:("Free Spins"; rm -rf ~)'
